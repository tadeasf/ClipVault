name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # Fails the build if the vault flavor gains a network permission or any sync code.
      - name: Verify vault flavor is offline
        run: ./gradlew :androidApp:verifyVaultDebugOffline :androidApp:verifyVaultReleaseOffline

      - name: Install a throwaway keyring for the Secret Service test
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus

      # Coverage gate on the jvm variant (common + jvm code). Android-only classes are covered by
      # instrumented tests (connectedAndroidDeviceTest), which Kover cannot measure.
      # Tests run inside a private D-Bus session with an unlocked, empty GNOME Keyring, so the
      # dbus-java Secret Service client is exercised; if the keyring fails to start, that test skips.
      - name: Tests and coverage gate
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            ./gradlew :shared:allTests :sync-core:allTests :shared:koverVerifyJvm :shared:koverHtmlReport
          '

      - name: Report whether the Secret Service test ran
        if: always()
        run: grep -c '<skipped' shared/build/test-results/jvmTest/TEST-cz.tadeasf.clipvault.security.DesktopKeyTest.xml || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shared
          path: shared/build/reports/kover/html

      - name: Build apps
        run: ./gradlew :androidApp:assembleVaultDebug :androidApp:assembleSyncDebug :desktopApp:jar
