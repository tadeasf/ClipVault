name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Handshake vectors match the independent Python reference
        run: |
          python3 -m pip install -r tools/requirements.txt
          python3 tools/handshake_vectors.py --check

      # Fails the build if the vault flavor gains a network permission or any sync code.
      - name: Verify vault flavor is offline
        run: ./gradlew :androidApp:verifyVaultDebugOffline :androidApp:verifyVaultReleaseOffline

      - name: Install a throwaway keyring for the Secret Service test
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus

      # Coverage gate on the jvm variant (common + jvm code). Android-only classes are covered by
      # instrumented tests (connectedAndroidDeviceTest), which Kover cannot measure.
      # Tests run inside a private D-Bus session with an unlocked, empty GNOME Keyring, so the
      # dbus-java Secret Service client is exercised; if the keyring fails to start, that test skips.
      - name: Tests and coverage gate
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            ./gradlew :shared:allTests :ui:allTests :sync-core:allTests :shared:koverVerifyJvm :shared:koverHtmlReport :sync-core:koverVerifyJvm
          '

      - name: Report whether the Secret Service test ran
        if: always()
        run: grep -c '<skipped' shared/build/test-results/jvmTest/TEST-cz.tadeasf.clipvault.security.DesktopKeyTest.xml || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shared
          path: shared/build/reports/kover/html

      - name: Build apps
        run: ./gradlew :androidApp:assembleVaultDebug :androidApp:assembleSyncDebug :androidApp:assembleVaultDebugAndroidTest :desktopApp:jar

      - name: Desktop agent tests
        run: ./gradlew :desktopApp:test

      # .rpm, .deb (with Recommends: copyq) and AppImage of clipvault-agent
      - name: Package desktop agent
        run: |
          sudo apt-get install -y --no-install-recommends fakeroot rpm
          scripts/package-linux.sh

      # The .rpm on a clean Fedora: install, then run the CLI from PATH as a normal user, with /opt on PATH
      # after /usr/bin (a real user's setup that once resolved the /opt/clipvault-agent directory instead).
      - name: Smoke-test the .rpm in Fedora
        run: |
          docker run --rm -v "$PWD/desktopApp/build/compose/binaries/main/rpm:/pkg:ro" fedora:44 bash -euc '
            dnf install -y -q --setopt=install_weak_deps=False util-linux /pkg/*.rpm
            useradd -m tester
            su - tester -c "PATH=/usr/local/bin:/usr/bin:/opt; command -v clipvault-agent; readlink -f \$(command -v clipvault-agent); clipvault-agent --help | head -3"
            su - tester -c "XDG_RUNTIME_DIR=\$(mktemp -d) clipvault-agent status --dry-run"
          '

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: clipvault-agent-packages
          path: |
            desktopApp/build/compose/binaries/main/rpm/*.rpm
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/*.AppImage
